[project]
name = "wcpred"
version = "0.1.0"
description = "2026 FIFA World Cup prediction: Elo + Poisson + Monte Carlo, backtested vs 2006-2022"
requires-python = ">=3.11"
dependencies = ["pandas", "numpy", "scipy", "scikit-learn"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
