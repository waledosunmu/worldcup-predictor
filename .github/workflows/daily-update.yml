name: Forecast update (3-hourly, kickoff-aware odds)

on:
  schedule:
    # Every 3h. snapshot_odds is kickoff-aware (ODDS_SNAPSHOT_WINDOW_H) so it only
    # spends API credits when a match is near or for the daily baseline; the cheap
    # local steps (forecast/consensus/history/site) just keep the site fresh.
    # Scale-down knobs if quota tightens: widen this cron, raise ODDS_SNAPSHOT_WINDOW_H,
    # raise ODDS_SNAPSHOT_BASELINE_H. Review output/odds_movement.md to decide.
    - cron: "0 */3 * * *"
  workflow_dispatch: {}    # manual trigger from the Actions tab

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pandas numpy scipy scikit-learn

      - name: Run update pipeline
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          ODDS_SNAPSHOT_WINDOW_H: "3"   # snapshot odds only within 3h of a kickoff
          PYTHON: python
        run: bash scripts/update_all.sh

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes today."
            exit 0
          fi
          git commit -m "Daily update $(date -u +%F)"
          git push
